<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Login — Portfolio CMS</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    #login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    #login-box { width: 100%; max-width: 360px; background: #0d1117; border: 1px solid #30363d; border-radius: 14px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    #login-box h1 { font-size: 1.25rem; margin: 0 0 16px; color: #e6edf3; font-family: system-ui, sans-serif; }
    #login-box label { display: block; font-size: .85rem; color: #8b949e; margin: 0 0 6px; }
    #login-box input { width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #e6edf3; font: inherit; box-sizing: border-box; }
    #login-box button { width: 100%; margin-top: 14px; padding: 10px; border: none; background: #238636; color: #fff; font-weight: 700; border-radius: 8px; cursor: pointer; }
    #login-box button:hover { background: #2ea043; }
    #login-error { color: #ff7b72; font-size: .85rem; margin-top: 10px; min-height: 1.2em; }
  </style>
</head>
<body>
  <div id="login-wrap">
    <div id="login-box">
      <h1>Admin Login</h1>
      <label for="adminPw">Password</label>
      <input type="password" id="adminPw" autocomplete="off" />
      <button id="loginBtn">Login</button>
      <div id="login-error" aria-live="polite"></div>
    </div>
  </div>
  <script>
    const ADMIN_HASH = '240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9';
    const AUTH_KEY = 'admin-auth';

    function subtleSha256Hex(str) {
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)).then((buf) =>
        Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('')
      );
    }

    function sha256Hex(message) {
      const bytes = new TextEncoder().encode(message);
      const bitLen = bytes.length * 8;
      const padded = new Uint8Array((((bytes.length + 8) >> 6) + 1) << 6);
      padded.set(bytes);
      padded[bytes.length] = 0x80;
      const dv = new DataView(padded.buffer);
      dv.setUint32(padded.length - 8, Math.floor(bitLen / 0x100000000));
      dv.setUint32(padded.length - 4, bitLen >>> 0);
      const H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
      const K = [
        0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
        0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
        0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
        0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
        0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
        0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
        0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
        0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
      ];
      const rotr = (x, n) => (x >>> n) | (x << (32 - n));
      const w = new Array(64);
      for (let off = 0; off < padded.length; off += 64) {
        for (let t = 0; t < 16; t++) w[t] = dv.getUint32(off + t * 4);
        for (let t = 16; t < 64; t++) {
          const s0 = rotr(w[t - 15], 7) ^ rotr(w[t - 15], 18) ^ (w[t - 15] >>> 3);
          const s1 = rotr(w[t - 2], 17) ^ rotr(w[t - 2], 19) ^ (w[t - 2] >>> 10);
          w[t] = (w[t - 16] + s0 + w[t - 7] + s1) | 0;
        }
        let a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
        for (let t = 0; t < 64; t++) {
          const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
          const ch = (e & f) ^ (~e & g);
          const t1 = (h + S1 + ch + K[t] + w[t]) | 0;
          const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
          const maj = (a & b) ^ (a & c) ^ (b & c);
          const t2 = (S0 + maj) | 0;
          h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
        }
        H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0;
        H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
      }
      return H.map((x) => (x >>> 0).toString(16).padStart(8, '0')).join('');
    }

    const loginBtn = document.getElementById('loginBtn');
    const pwInput = document.getElementById('adminPw');
    const errorEl = document.getElementById('login-error');
    async function attemptLogin() {
      const pw = pwInput.value;
      if (!pw) {
        errorEl.textContent = 'Incorrect password.';
        return;
      }
      errorEl.textContent = '';
      let hash;
      try {
        hash = (window.crypto && crypto.subtle && typeof crypto.subtle.digest === 'function')
          ? await subtleSha256Hex(pw)
          : sha256Hex(pw);
      } catch (e) {
        hash = sha256Hex(pw);
      }
      if (hash === ADMIN_HASH) {
        try { sessionStorage.setItem(AUTH_KEY, JSON.stringify({ t: Date.now() })); } catch (e) {}
        window.location.href = 'admin.html';
        return;
      }
      errorEl.textContent = 'Incorrect password.';
      pwInput.value = '';
      pwInput.focus();
    }
    loginBtn.addEventListener('click', attemptLogin);
    pwInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') attemptLogin(); });
  </script>
</body>
</html>
